name: Publish tagged release

on:
  push:
    tags:
      - 'v*'
      - 'lite-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [[ "${TAG}" == lite-v* ]]; then
            version="${TAG#lite-v}"
            apk="Screen-Awake-Lite-${version}.apk"
            notes="RELEASE_NOTES_LITE_${version}.md"
            release_name="Screen Awake Lite ${version}"
          else
            version="${TAG#v}"
            apk="Screen-Awake-${version}.apk"
            notes="RELEASE_NOTES_${version}.md"
            release_name="Screen Awake ${version}"
          fi
          checksum="${apk}.sha256"
          base="https://raw.githubusercontent.com/${REPO}/${GITHUB_SHA}"
          curl -fsSL "${base}/${apk}" -o "${apk}"
          curl -fsSL "${base}/${checksum}" -o "${checksum}"
          curl -fsSL "${base}/${notes}" -o "${notes}"

          prerelease=false
          case "${version}" in
            *preview*|*alpha*|*beta*|*rc*) prerelease=true ;;
          esac

          common="$(jq -n \
            --arg name "${release_name}" \
            --arg body "$(cat "${notes}")" \
            --argjson prerelease "${prerelease}" \
            '{name:$name,body:$body,draft:false,prerelease:$prerelease}')"

          auth=(-H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28')

          tag_url="${API_URL}/repos/${REPO}/releases/tags/${TAG}"
          if response="$(curl -fsS "${auth[@]}" "${tag_url}" 2>/dev/null)"; then
            release_id="$(jq -r '.id' <<<"${response}")"
            response="$(curl -fsS -X PATCH "${auth[@]}" -d "${common}" \
              "${API_URL}/repos/${REPO}/releases/${release_id}")"
          else
            create="$(jq -c --arg tag "${TAG}" \
              '. + {tag_name:$tag}' <<<"${common}")"
            response="$(curl -fsS -X POST "${auth[@]}" -d "${create}" \
              "${API_URL}/repos/${REPO}/releases")"
            release_id="$(jq -r '.id' <<<"${response}")"
          fi

          upload_url="$(jq -r '.upload_url' <<<"${response}" | sed 's/{?name,label}//')"
          assets="$(curl -fsS "${auth[@]}" \
            "${API_URL}/repos/${REPO}/releases/${release_id}/assets?per_page=100")"

          for file in "${apk}" "${checksum}"; do
            while read -r asset_id; do
              [ -n "${asset_id}" ] || continue
              curl -fsS -X DELETE "${auth[@]}" \
                "${API_URL}/repos/${REPO}/releases/assets/${asset_id}" >/dev/null
            done < <(jq -r --arg name "${file}" '.[] | select(.name==$name) | .id' <<<"${assets}")
          done

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@${apk}" \
            "${upload_url}?name=${apk}" >/dev/null

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Content-Type: text/plain' \
            --data-binary "@${checksum}" \
            "${upload_url}?name=${checksum}" >/dev/null

          echo "Published ${TAG} from ${GITHUB_SHA}"
